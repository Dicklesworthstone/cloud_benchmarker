name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Static analysis (mypy + bandit)
        # bandit skips: B404/B603/B607 -- the scheduler launches
        # ansible-playbook resolved from PATH with list argv and no shell;
        # deliberate and safe for a local operator tool.
        run: |
          mypy web_app/app script_to_generate_overall_benchmark_scores_from_subscores.py
          bandit -r web_app -q --skip B404,B603,B607

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate Ansible playbook syntax
        run: ansible-playbook --syntax-check -i my_ansible_inventory_file.ini benchmark-playbook.yml
