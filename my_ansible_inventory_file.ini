[all]
TestnetSupernode01 ansible_host=1.2.3.4
TestnetSupernode02 ansible_host=1.2.3.5
TestnetSupernode03 ansible_host=1.2.3.6


[all:vars]
ansible_user=ubuntu
ansible_private_key_file="my-secret-ssh-key.pem"
# Trust-on-first-use: without this, the very first benchmark against a new
# host fails SSH host-key verification.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
